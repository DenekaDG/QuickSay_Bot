services:
  # 1. Сервис Брокера сообщений (Redis)
  redis:
    image: redis:7-alpine
    container_name: quicksay_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 2. Сервис Базы Данных (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: quicksay_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Сервис Telegram-Бота (bot.py)
  bot:
    build: .
    container_name: quicksay_bot
    restart: always
    command: python3 bot.py
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    volumes:
      - .:/app

  # 4. Сервис Фонового Воркера (Celery)
  worker:
    build: .
    container_name: quicksay_worker
    restart: always
    command: celery -A tasks.celery_app worker --loglevel=info --pool=solo
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    volumes:
      - .:/app

# 5. Веб-панель управления базой (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4
    container_name: quicksay_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8585:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
