[pytest]
# Pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70

# Markers for test organization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    db: Tests requiring database
    async: Async tests

# Asyncio mode
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test_results.log
log_file_level = DEBUG

# Timeout (in seconds)
timeout = 300

# Ignore deprecation warnings in dependencies
filterwarnings =
    ignore::DeprecationWarning
